<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>字距测量台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" style="width: 520px; margin: 0 auto; padding: 20px;">
  <div class="dialogue-area">
    <!-- 对话形式（与游戏同结构） -->
    <div class="bubble">
      <div class="avatar">👦</div>
      <div class="bubble-body">
        <div class="speaker-name">小明</div>
        <div class="bubble-text" id="bubbleText"></div>
      </div>
    </div>
    <!-- 文档形式（与游戏同结构） -->
    <div class="doc-card doc-essay">
      <div class="doc-badge">📝 小作文</div>
      <div class="doc-title">字距测试</div>
      <div class="doc-body">
        <p class="doc-para" id="docPara"></p>
      </div>
    </div>
  </div>
</div>
<pre id="result" style="padding:20px; font-size:14px; color:#111; background:#fff;"></pre>

<script>
const text = "放学铃声刚想窗外就下起了倾盆大雨我站在教学楼门口望着灰蒙蒙的天空发愁早上出门太急把伞落在了家里真是倒霉透顶的一天";
function fill(el) {
  [...text].forEach(ch => {
    const s = document.createElement("span");
    s.className = "char";
    s.textContent = ch;
    el.appendChild(s);
  });
}
fill(document.getElementById("bubbleText"));
fill(document.getElementById("docPara"));

function measure(el) {
  const cs = getComputedStyle(el);
  const spans = [...el.querySelectorAll(".char")];
  const rects = spans.map(s => s.getBoundingClientRect());
  // 只统计同一行内相邻两字的左缘差 → 真实“每字步进”
  const dxs = [];
  for (let i = 1; i < rects.length; i++) {
    if (Math.abs(rects[i].top - rects[i - 1].top) < 2) dxs.push(rects[i].left - rects[i - 1].left);
  }
  const advance = dxs.reduce((a, b) => a + b, 0) / dxs.length;
  const advanceExact = dxs.length ? +advance.toFixed(3) : null;
  // 行高：找第一对跨行的 top 差
  let lineStep = null;
  for (let i = 1; i < rects.length; i++) {
    if (rects[i].top - rects[i - 1].top > 2) { lineStep = +(rects[i].top - rects[i - 1].top).toFixed(1); break; }
  }
  const spanW = +rects[3].width.toFixed(2);
  return {
    字号: cs.fontSize, letter间距: cs.letterSpacing, 行高: cs.lineHeight,
    span宽: spanW, 每字步进: advanceExact, 行步进: lineStep, 每行字数: dxs.length
  };
}
const b = measure(document.getElementById("bubbleText"));
const d = measure(document.getElementById("docPara"));
const diff = Math.abs((b.每字步进 || 0) - (d.每字步进 || 0));
document.getElementById("result").textContent =
  "对话 bubble-text: " + JSON.stringify(b) + "\n" +
  "文档 doc-para   : " + JSON.stringify(d) + "\n" +
  "每字步进差: " + diff.toFixed(3) + "px → " + (diff < 0.6 ? "完全一致" : "不一致，差了 " + diff.toFixed(2) + "px");
</script>
</body>
</html>
